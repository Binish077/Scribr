{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Video List</h2>
    <p>Number of videos: {{ videos|length }}</p>
    {% if videos %}
        <ul>
            
            {% for video in videos %}
                <li>
                    <h3>{{ video.title }}</h3>
                    <p>{{ video.description }}</p>
                    <video width="320" height = "240" controls>
                        <source src="{{ video.video_file.url }}" type="video/mp4">
                        Your Browser does not support the video tag
                    </video>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No videos found.</p>
    {% endif %}
</div>
{% endblock %}
